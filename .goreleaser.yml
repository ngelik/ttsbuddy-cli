version: 2

project_name: ttsbuddy

builds:
  - id: ttsbuddy
    main: ./cmd/ttsbuddy
    binary: ttsbuddy
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ngelik/ttsbuddy-cli/cmd.Version={{.Version}}
      - -X github.com/ngelik/ttsbuddy-cli/cmd.Commit={{.ShortCommit}}
      - -X github.com/ngelik/ttsbuddy-cli/cmd.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: darwin
        formats:
          - zip

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

release:
  draft: true

homebrew_casks:
  - name: ttsbuddy
    repository:
      owner: ngelik
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    skip_upload: true
    url:
      verified: github.com/ngelik/ttsbuddy-cli
    homepage: https://ttsbuddy.com
    description: "TTSBuddy CLI — convert text to speech from the command line"
    license: MIT
    binaries:
      - ttsbuddy
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ttsbuddy"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
