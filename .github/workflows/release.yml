name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.7"
  CLERK_OAUTH_CLIENT_ID: ${{ vars.CLERK_OAUTH_CLIENT_ID }}
  EXPECTED_CLERK_OAUTH_CLIENT_ID: "gRApqxGCscvVfceh"

jobs:
  authorize-release:
    name: Authorize release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify workflow action pins
        run: make check-actions-pinned
      - name: Require the public Clerk OAuth client ID
        run: test "$CLERK_OAUTH_CLIENT_ID" = "$EXPECTED_CLERK_OAUTH_CLIENT_ID"
      - name: Verify tag authorization and provenance
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_ACTOR" = "ngelik"
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(git cat-file -t "$RELEASE_REF")" = tag
          tag_commit="$(git rev-list -n 1 "$RELEASE_REF")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_commit" origin/main
          test "$tag_commit" = "${GITHUB_SHA}"
      - name: Unit and race tests
        run: go test -race -count=1 ./...
      - name: Install pinned security and lint tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Lint
        run: golangci-lint run

  install-regression:
    name: Install regression
    needs: authorize-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify tagged Go installation
        run: ./scripts/test-go-install.sh
        env:
          INSTALL_TARGET: github.com/ngelik/ttsbuddy-cli/cmd/ttsbuddy@${{ github.ref_name }}
          EXPECTED_VERSION: ${{ github.ref_name }}
          GOPROXY: direct

  acceptance:
    name: Live acceptance
    needs: authorize-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Require the acceptance-test credential
        env:
          TTSBUDDY_API_KEY: ${{ secrets.TTSBUDDY_API_KEY }}
        run: test -n "$TTSBUDDY_API_KEY"
      - name: Build the tagged CLI
        run: make build
      - name: Run live acceptance tests
        env:
          TTSBUDDY_API_KEY: ${{ secrets.TTSBUDDY_API_KEY }}
        run: make test-acceptance

  release-snapshot:
    name: Release snapshot
    needs: authorize-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Build release snapshot and SBOMs
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --snapshot --clean --skip=sign
      - name: Verify OAuth client ID in every snapshot binary
        run: |
          set -euo pipefail
          artifact_count=0
          for binary in dist/ttsbuddy_*/ttsbuddy; do
            test -f "$binary"
            grep -aFq "$EXPECTED_CLERK_OAUTH_CLIENT_ID" "$binary"
            artifact_count=$((artifact_count + 1))
          done
          test "$artifact_count" -eq 4

  release:
    name: Publish signed release
    needs: [acceptance, install-regression, release-snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create signed draft with checksums and SBOMs
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify OAuth client ID in every release binary
        run: |
          set -euo pipefail
          artifact_count=0
          for binary in dist/ttsbuddy_*/ttsbuddy; do
            test -f "$binary"
            grep -aFq "$EXPECTED_CLERK_OAUTH_CLIENT_ID" "$binary"
            artifact_count=$((artifact_count + 1))
          done
          test "$artifact_count" -eq 4
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ngelik/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Migrate the legacy formula to the cask
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          test -f ../dist/homebrew/Casks/ttsbuddy.rb
          mkdir -p Casks
          cp ../dist/homebrew/Casks/ttsbuddy.rb Casks/ttsbuddy.rb
          git rm -f --ignore-unmatch Formula/ttsbuddy.rb
          if [ -f tap_migrations.json ]; then
            jq '. + {"ttsbuddy": "ttsbuddy"}' tap_migrations.json > tap_migrations.json.tmp
            mv tap_migrations.json.tmp tap_migrations.json
          else
            printf '%s\n' '{"ttsbuddy":"ttsbuddy"}' > tap_migrations.json
          fi
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tap_migrations.json Casks/ttsbuddy.rb
          git commit -m "Migrate ttsbuddy formula to cask"
          git push
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
