name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 9 * * 2"
  workflow_dispatch:
    inputs:
      live_acceptance:
        description: Run live TTS acceptance on main before tagging a release
        type: boolean
        default: false
        required: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.9"

jobs:
  actions-security:
    name: Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make check-actions-pinned

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

  test:
    name: Test
    needs: actions-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -count=1 ./...

  hermes-plugin:
    name: Hermes plugin tests
    needs: actions-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Hermes v0.21.7 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 71d34bad1045610252eda02ee79549436896e784 # v0.21.7
      - name: Checkout TTS Buddy CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: ttsbuddy-cli
      - name: Prepare Hermes PM test environment
        id: hermes-pm
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
      - name: Run plugin regression tests against pinned Hermes
        env:
          HERMES_SOURCE: ${{ github.workspace }}
          HERMES_PYTHON: ${{ steps.hermes-pm.outputs.python-path }}
        run: make -C ttsbuddy-cli test-hermes-plugin

  govulncheck:
    name: Govulncheck
    needs: actions-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  codeql:
    name: CodeQL
    needs: actions-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          queries: security-extended
      - name: Build
        run: go build -trimpath ./cmd/ttsbuddy
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go

  lint:
    name: Lint
    needs: actions-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  build:
    name: Build
    needs: actions-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build -trimpath -o bin/ttsbuddy ./cmd/ttsbuddy
      - run: ./scripts/test-go-install.sh

  security-gate:
    name: Security gate
    if: always()
    needs: [actions-security, dependency-review, test, hermes-plugin, govulncheck, codeql, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to pass
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTIONS_SECURITY: ${{ needs.actions-security.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          TEST: ${{ needs.test.result }}
          HERMES_PLUGIN: ${{ needs.hermes-plugin.result }}
          GOVULNCHECK: ${{ needs.govulncheck.result }}
          CODEQL: ${{ needs.codeql.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          test "$ACTIONS_SECURITY" = success
          test "$TEST" = success
          test "$HERMES_PLUGIN" = success
          test "$GOVULNCHECK" = success
          test "$CODEQL" = success
          test "$LINT" = success
          test "$BUILD" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_REVIEW" = success
          else
            test "$DEPENDENCY_REVIEW" = skipped
          fi

  live-acceptance:
    name: Pre-release live acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.live_acceptance && github.ref == 'refs/heads/main' && github.actor == 'ngelik'
    needs: [test, lint, govulncheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cli-live-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build the source-pinned CLI
        run: |
          test "$CLERK_OAUTH_CLIENT_ID" = "gRApqxGCscvVfceh"
          make build
        env:
          CLERK_OAUTH_CLIENT_ID: ${{ vars.CLERK_OAUTH_CLIENT_ID }}
      - name: Run live acceptance with the existing test credential
        env:
          TTSBUDDY_API_KEY: ${{ secrets.TTSBUDDY_API_KEY }}
        run: |
          test -n "$TTSBUDDY_API_KEY"
          make test-acceptance
